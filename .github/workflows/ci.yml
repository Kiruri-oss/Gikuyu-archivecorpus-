name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("/tmp/npm-audit.json","utf8")); for (const [name,v] of Object.entries(a.vulnerabilities||{})) { const via=(v.via||[]).map(x=>typeof x==="string"?x:x.title).join("; "); console.log(`${v.severity.toUpperCase()} ${name} | fix=${JSON.stringify(v.fixAvailable)} | ${via}`); }'
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Smoke-test production API routes locally
        run: |
          set -x
          npm run start -- --hostname 127.0.0.1 > /tmp/gikuyu-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/gikuyu-health.json; then
              break
            fi
            sleep 2
          done
          node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("/tmp/gikuyu-health.json","utf8")); if(h.status!=="ok" || h.service!=="gikuyu-archive-web") { console.error(h); process.exit(1); }'
          orthography_status=$(curl --silent --output /tmp/gikuyu-orthography.json --write-out "%{http_code}" -H "Content-Type: application/json" --data '{"text":"mucii"}' http://127.0.0.1:3000/api/v1/orthography)
          test "$orthography_status" = "200"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/gikuyu-orthography.json","utf8")); if(d.suggested_text!=="mũciĩ" || d.suggestions.length!==1) { console.error(d); process.exit(1); }'
          invalid_status=$(curl --silent --output /tmp/gikuyu-invalid.json --write-out "%{http_code}" "http://127.0.0.1:3000/api/v1/search?q=x")
          test "$invalid_status" = "400"
          valid_status=$(curl --silent --output /tmp/gikuyu-search.json --write-out "%{http_code}" --max-time 20 "http://127.0.0.1:3000/api/v1/search?q=Gikuyu")
          case "$valid_status" in
            200) node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/gikuyu-search.json","utf8")); if(!Array.isArray(d.media)) { console.error(d); process.exit(1); }' ;;
            502) node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/gikuyu-search.json","utf8")); if(!String(d.detail||"")) { console.error(d); process.exit(1); }' ;;
            *) echo "Unexpected search response: $valid_status"; cat /tmp/gikuyu-search.json; exit 1 ;;
          esac
          invalid_language_status=$(curl --silent --output /tmp/gikuyu-invalid-language.json --write-out "%{http_code}" "http://127.0.0.1:3000/api/v1/search?q=Kinyarwanda&lang=not-a-language")
          test "$invalid_language_status" = "400"
          non_gikuyu_status=$(curl --silent --output /tmp/gikuyu-non-gikuyu.json --write-out "%{http_code}" --max-time 20 "http://127.0.0.1:3000/api/v1/search?q=Kinyarwanda&lang=rw")
          test "$non_gikuyu_status" = "400"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/gikuyu-non-gikuyu.json","utf8")); if(!String(d.detail||"").includes("Gĩkũyũ")) { console.error(d); process.exit(1); }'
          languages_page_status=$(curl --silent --output /tmp/gikuyu-languages.html --write-out "%{http_code}" http://127.0.0.1:3000/languages)
          test "$languages_page_status" = "200"
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-that-is-long-enough
          DATABASE_URL: postgresql+asyncpg://gikuyu:gikuyu@localhost:5432/gikuyu_archive
          REDIS_URL: redis://redis:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          MEILISEARCH_KEY: test
        run: pytest -q -o log_cli=false
