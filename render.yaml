# Free-tier deployment blueprint.
# PostgreSQL metadata in Supabase; file storage may use Firebase or S3-compatible storage.
# Render's free PostgreSQL expires after 30 days, so it is not used as the archive database.
services:
  - type: web
    name: gikuyu-archive-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Gikuyu Archive Corpus
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://gikuyu-archivecorpus.vercel.app
      - key: BACKEND_URL
        value: https://gikuyu-archive-api.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
