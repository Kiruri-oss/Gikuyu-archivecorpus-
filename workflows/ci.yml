- name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: '20'
    cache: 'npm'

- name: Frontend - install & checks
  working-directory: frontend
  run: |
    npm ci
    npm run typecheck
    npm run lint
    npm run build

- name: Setup Python
  uses: actions/setup-python@v4
  with:
    python-version: '3.11'

- name: Backend - install & tests
  working-directory: backend
  run: |
    python -m venv .venv
    source .venv/bin/activate
    pip install --upgrade pip
    pip install -e .
    pip install pytest
    pytest -v

- name: Functions - install & tests
  if: fileExists('functions/requirements.txt')
  working-directory: functions
  run: |
    python -m venv .venv
    source .venv/bin/activate
    pip install --upgrade pip
    pip install -r requirements.txt || true
    pip install pytest || true
    pytest -v || true