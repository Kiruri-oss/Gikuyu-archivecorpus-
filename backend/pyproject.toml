[project]
name = "gikuyu-archive-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "gunicorn==23.0.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.19",
    "email-validator==2.2.0",
    "httpx==0.28.1",
    "structlog==24.4.0",
    "boto3==1.35.76",
    "redis==5.2.1",
    "celery==5.4.0",
    "apscheduler==3.11.0",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "trafilatura==2.0.0",
    "yt-dlp==2024.12.6",
    "slowapi==0.1.9",
    "aiosqlite==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]
ai = [
    "transformers==4.47.0",
    "torch==2.5.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*"]
